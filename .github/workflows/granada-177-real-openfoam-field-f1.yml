name: Granada G5 — real Setup Portable all 36 workspaces; no RC

on:
  push:
    branches: [feat/granada-177-g5-all-native-workspaces-20261021, fix/granada-g5-real-b13-timeseries-visible-anchor-20261021, feat/granada-g7-real-b13-installed-portable-36-20261021, test/granada-g8-real-b13-windows-captures-20261021, test/granada-g10-b13-no-canvas-overlays-20261021, test/granada-g11-native-chart-focus-b13-20261021, test/granada-g11-four-filter-native-b13-20261021, test/granada-g12-real-b13-field-ribbon-20261022, test/granada-g13-b13-native-camera-proof-20261022, test/granada-g14-play-p0-installed-diagnostics-20261022, test/granada-g14-repeat-physics-evidence-20261022, test/granada-g16-b13-installed-play-repeats-20261022]
  pull_request:
    branches:
      - feat/granada-177-g5-all-native-workspaces-20261021
      - fix/granada-g5-real-b13-timeseries-visible-anchor-20261021
      - feat/granada-g7-real-b13-installed-portable-36-20261021
      - test/granada-g8-real-b13-windows-captures-20261021
      - test/granada-g11-four-filter-native-b13-20261021
      - test/granada-g12-real-b13-field-ribbon-20261022
      - test/granada-g13-b13-native-camera-proof-20261022
      - test/granada-g14-play-p0-installed-diagnostics-20261022
      - test/granada-g14-repeat-physics-evidence-20261022

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare-real-fixture:
    name: Preserve original measured QuickCup metal/mold B13 fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove source copier and native evidence checks reject synthetic success
        run: |
          python tools/test_granada_prepare_real_openfoam_b13.py
          python tools/test_granada_real_case_native_gate.py
          python tools/test_granada_packaged_parity_gate.py
          python tools/test_granada_prepare_g5_review_manifest.py
      - name: Require private original B13 access or fail explicitly
        env:
          HAS_QUICKCUP: ${{ secrets.QUICKCUP_FIXTURE_TOKEN != '' }}
        shell: bash
        run: |
          if [[ "$HAS_QUICKCUP" != "true" ]]; then
            echo "::error::QuickCup fixture token absent; real Field F1 cannot be marked validated"
            exit 1
          fi
      - name: Fetch original physical OpenFOAM QuickCup B13 fixture
        uses: actions/checkout@v4
        with:
          repository: realmichelduarte/QuickCup-Solidification
          ref: foamlens-real-fixture-b13
          token: ${{ secrets.QUICKCUP_FIXTURE_TOKEN }}
          persist-credentials: false
          path: quickcup-fixture
          sparse-checkout: cases_controlled_buoyancy
      - name: Original OpenFOAM case integration test, no mock data
        run: node desktop/tests/openfoam-integration.test.cjs quickcup-fixture/cases_controlled_buoyancy
      - name: Build five real B13 backed physical Windows cases with measured hashes
        run: |
          python tools/granada_prepare_real_openfoam_b13.py \
            --source quickcup-fixture/cases_controlled_buoyancy/B13_prghPressure_airGapOF14 \
            --destination multi-case-runtime-windows \
            --manifest multi-case-runtime-windows/granada_b13_manifest.json
      - name: Transfer measured source only to trusted Windows job (one day)
        uses: actions/upload-artifact@v4
        with:
          name: Granada-Original-B13-RealCase
          path: multi-case-runtime-windows/
          retention-days: 1
          if-no-files-found: error

  original-native-contracts:
    name: Pinned native/Field CAD scientific suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run canonical full main test manifest BEFORE staging extra original owner tests
        shell: bash
        run: node desktop/tests/test-suite-manifest.test.cjs
      - name: Confirm original main Field comparison regression BEFORE staging new source signature
        shell: bash
        run: node desktop/tests/field-compare.test.cjs
      - name: Verify exact-source host graft and existing 16-PR source guards
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_granada_native_host_composite.cjs
          node tools/test_granada_composite_candidate.cjs
          node tools/test_granada_science_native_host_gate.cjs
          node tools/test_granada_science_suite_registry.cjs
      - name: Assemble exact 16 science/CAD/UX PR owner JS and tests
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/granada_composite_candidate.cjs \
            --manifest tools/granada_composite_manifest.json \
            --root . --report artifacts/granada-native-g0g6-science-16-owners.json
      - name: Stage pinned ORIGINAL Field F1 v14 code and reconcile CAD + equivalent + Field native host smokes
        shell: bash
        run: |
          node tools/granada_native_host_composite.cjs \
            --report=artifacts/granada-native-host-field-cad-2d3d.json
      - name: All native Field F1 + CAD + equivalent + checkMesh original source regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            desktop/tests/field-multiregion-views.test.cjs \
            desktop/tests/field-compare.test.cjs \
            desktop/tests/field-multiview-ux.test.cjs \
            desktop/tests/cad-surface-inspector.test.cjs \
            desktop/tests/equivalent-observables.test.cjs \
            desktop/tests/checkmesh-region-evidence.spec.cjs \
            desktop/tests/checkmesh-multipanel-collision.spec.cjs \
            desktop/tests/granada-177-g23-data-analysis.spec.cjs \
            desktop/tests/granada-177-g6-export-preflight.spec.cjs \
            desktop/tests/thermocouple-xyz-mapping.spec.cjs \
            desktop/tests/multiregion-energy-conservation.spec.cjs \
            desktop/tests/solidification-front-proxy.spec.cjs \
            desktop/tests/solidification-front-tracker.test.cjs \
            desktop/tests/physics-evidence-explorer.spec.cjs \
            desktop/tests/reproducible-export.test.cjs \
            desktop/tests/section-ownership.test.cjs; do
            echo "== Original mixed source test: $suite"
            node "$suite"
          done
      - name: Verify preserved native Mesh auditor and provenance SHA checks
        shell: bash
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('desktop/src/FoamLensDesktop/Program.cs','utf8');for(const word of ['meshAuditSurfaceJson','FoamLens CAD STL/OBJ WebView2 smoke passed','FoamLens Granada equivalent-observables WebView2 smoke passed','FoamLens real OpenFOAM View B metal+mold and metric XYZ smoke passed'])if(!x.includes(word))throw Error('Missing original owner scientific guard '+word);console.log('Four independent native scientific guards all present')"
      - name: Upload source SHA provenance only; no physical dataset or binary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Granada-native-host-source-${{ matrix.os }}
          path: |
            artifacts/granada-native-g0g6-science-16-owners.json
            artifacts/granada-native-host-field-cad-2d3d.json
          if-no-files-found: warn
          retention-days: 14

  windows-native-composite:
    name: Actual Windows WebView2 — Field F1 CAD and 2D/3D, original Mesh auditor retained
    needs: [original-native-contracts, prepare-real-fixture]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download physically measured B13 metal and mold cases
        uses: actions/download-artifact@v4
        with:
          name: Granada-Original-B13-RealCase
          path: quickcup-runtime-fixture
      - name: Reverify original metal/mold time files by SHA on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content 'quickcup-runtime-fixture/granada_b13_manifest.json' -Raw | ConvertFrom-Json
          if ($m.schema -ne 'FoamLens-Granada-Real-OpenFOAM-B13-v1' -or $m.case_names.Count -ne 5) {
            throw 'B13 case provenance or original case count invalid'
          }
          foreach ($name in $m.case_names) {
            foreach ($rel in @('0/metal/T','0/mold/T','9.8/metal/T','9.8/mold/T')) {
              $path=Join-Path (Join-Path 'quickcup-runtime-fixture' $name) $rel
              if ($name -eq 'SmokeCase_Asymmetric' -and $rel -eq '9.8/mold/T') {
                if (Test-Path $path) { throw 'Fabricated mold frame present in asymmetric case' }
                continue
              }
              if (-not (Test-Path $path)) { throw "Missing real measured temperature $name/$rel" }
              $expected=$m.required_file_sha256.PSObject.Properties[$rel].Value
              if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
                throw "Measured case values changed $name/$rel"
              }
            }
          }
          Write-Host 'B13 original measured metal/mold SHA verified across five case identities'
      - name: Recheck all live SHA refs before bundling original modules
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/granada_composite_candidate.cjs \
            --manifest tools/granada_composite_manifest.json \
            --root . --report artifacts/granada-full-native-16-owners.json
          node tools/granada_native_host_composite.cjs \
            --report=artifacts/granada-native-host-reconciliation.json
      - name: Add fail-closed G5 native tab capture to TEMPORARY reconciled Windows host only
        shell: bash
        run: |
          node tools/test_granada_g5_native_capture_host.cjs
          node tools/granada_g5_native_capture_host.cjs --report=artifacts/granada-g5-native-host-graft.json
      - name: Add pinned G7 compact UI to temporary native Windows test app only
        shell: bash
        run: |
          set -euo pipefail
          expected='fa864aac7c92b39dff6801e9ef1067008f6b986c'
          found="$(git ls-remote origin refs/pull/205/head | awk '{print $1}')"
          if [[ "$found" != "$expected" ]]; then
            echo "::error::G7 PR #205 source SHA drift; do not capture unreviewed module"
            exit 1
          fi
          git fetch --no-tags origin "+refs/pull/205/head:refs/remotes/granada/g7-pr205"
          test "$(git rev-parse refs/remotes/granada/g7-pr205)" = "$expected"
          git show "$expected:desktop/src/FoamLensDesktop/frontend/v27-granada-compact-workbench.js" > desktop/src/FoamLensDesktop/frontend/v27-granada-compact-workbench.js
          git show "$expected:tools/granada_g7_compact_workbench.test.cjs" > tools/granada_g7_compact_workbench.test.cjs
          node --check desktop/src/FoamLensDesktop/frontend/v27-granada-compact-workbench.js
          node --test tools/granada_g7_compact_workbench.test.cjs
          echo 'Exact PR #205 G7 source and original handler tests passed; bundling test-only'
      - name: Add pinned G8 original Time Series compact UI to temporary Windows B13 app only
        shell: bash
        run: |
          set -euo pipefail
          expected='a2fa8ac52815949652c89f37b0f95d86d9b15719'
          found="$(git ls-remote origin refs/pull/209/head | awk '{print $1}')"
          if [[ "$found" != "$expected" ]]; then
            echo '::error::G8 PR #209 head changed; recapture must use a new explicitly pinned reviewed SHA'
            exit 1
          fi
          git fetch --no-tags origin '+refs/pull/209/head:refs/remotes/granada/g8-pr209'
          test "$(git rev-parse refs/remotes/granada/g8-pr209)" = "$expected"
          git show "$expected:desktop/src/FoamLensDesktop/frontend/v28-granada-compact-timeseries.js" > desktop/src/FoamLensDesktop/frontend/v28-granada-compact-timeseries.js
          git show "$expected:tools/granada_g8_compact_timeseries.test.cjs" > tools/granada_g8_compact_timeseries.test.cjs
          node --check desktop/src/FoamLensDesktop/frontend/v28-granada-compact-timeseries.js
          node --test tools/granada_g8_compact_timeseries.test.cjs
          echo 'Exact PR #209 G8 source and original selector regression passed; packaging only in temporary checkout'
      - name: Pin merged T1 source evidence into ephemeral G8 Windows B13 app
        shell: bash
        run: |
          set -euo pipefail
          expected='e889415f382371ab272b700c76b5c266a418ee49'
          file='desktop/src/FoamLensDesktop/frontend/v14-dual-timeseries.js'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/granada/verified-t1-main'
          git merge-base --is-ancestor "$expected" refs/remotes/granada/verified-t1-main
          test "$(git rev-parse "$expected:$file")" = 'd49c6c8479ca4e3f3f53e5ccc9ab9afe1150cf87'
          git show "$expected:$file" > "$file"
          git show "$expected:desktop/tests/timeseries-provenance.test.cjs" > desktop/tests/timeseries-provenance.test.cjs
          git show "$expected:desktop/tests/timeseries-source-catalog.test.cjs" > desktop/tests/timeseries-source-catalog.test.cjs
          node --check "$file"
          node desktop/tests/dual-timeseries.test.cjs
          node desktop/tests/timeseries-source-catalog.test.cjs
          node desktop/tests/timeseries-provenance.test.cjs
          echo 'Merged T1 exact source and original Time Series + provenance tests passed in ephemeral G8 host'
      - name: Pin merged G10 outside-canvas original Preview Tools in temporary G9 native host
        shell: bash
        run: |
          set -euo pipefail
          expected='ab9faa151e8afa3b3379b4758d80aa7c12fd615e'
          file='desktop/src/FoamLensDesktop/frontend/v29-granada-plot-toolbar.js'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/granada/g10-main'
          git merge-base --is-ancestor "$expected" refs/remotes/granada/g10-main
          test "$(git rev-parse "$expected:$file")" = '7bc5a1288de579739fc0656d0c0599e6948a2052'
          git show "$expected:$file" > "$file"
          git show "$expected:tools/granada_g10_preview_toolbar.test.cjs" > tools/granada_g10_preview_toolbar.test.cjs
          node --check "$file"
          node --test tools/granada_g10_preview_toolbar.test.cjs
          echo 'G10 original no-overlay toolbar: exact merged source, 9 DOM/keyboard/failure tests; staged only in temporary native host'
      - name: Pin merged G11 viewport-first scientific chart without modifying source values
        shell: bash
        run: |
          set -euo pipefail
          expected='dfe1735e3ec503728e3459a4a63fcaafe34e7445'
          file='desktop/src/FoamLensDesktop/frontend/v30-granada-chart-focus.js'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/granada/g11-main'
          git merge-base --is-ancestor "$expected" refs/remotes/granada/g11-main
          test "$(git rev-parse "$expected:$file")" = 'dcb6ca9514ab1672ceda7e2d784e91102a6c57d0'
          git show "$expected:$file" > "$file"
          git show "$expected:tools/granada_g11_compact_chart_focus.test.cjs" > tools/granada_g11_compact_chart_focus.test.cjs
          node --check "$file"
          node --test tools/granada_g11_compact_chart_focus.test.cjs
          grep -Fq 'max-height:225px!important' "$file" || { echo '::error::G11 secondary variable/cases selector regression'; exit 1; }
          echo 'Original G11 chart-focus source, bilingual user toggle, saved-series protection and 11 tests validated'
      - name: Pin G12 original Field Play 1140px responsive source into TEMPORARY B13 host only
        shell: bash
        run: |
          set -euo pipefail
          expected='c7254c84dca3b4f53a931beaa578c85e1a5890bb'
          found="$(git ls-remote origin refs/pull/226/head | awk '{print $1}')"
          if [[ "$found" != "$expected" ]]; then
            echo '::error::G12 PR #226 changed; do not silently inspect different Field/Play code'
            exit 1
          fi
          git fetch --no-tags origin '+refs/pull/226/head:refs/remotes/granada/g12-original-field'
          test "$(git rev-parse refs/remotes/granada/g12-original-field)" = "$expected"
          git show "$expected:desktop/src/FoamLensDesktop/frontend/v31-granada-wide-field-ribbon.js" > desktop/src/FoamLensDesktop/frontend/v31-granada-wide-field-ribbon.js
          git show "$expected:tools/granada_g12_wide_field_ribbon.test.cjs" > tools/granada_g12_wide_field_ribbon.test.cjs
          node --check desktop/src/FoamLensDesktop/frontend/v31-granada-wide-field-ribbon.js
          node --test tools/granada_g12_wide_field_ribbon.test.cjs
          echo 'Original G12 source and negative Field Play clipping regressions pinned for real native WebView2'
      - name: Pin G13 seven ORIGINAL labelled Field Camera controls in throwaway Windows B13 host
        shell: bash
        run: |
          set -euo pipefail
          expected='f394e5f765b8fb3e0ced367d3625eb3bfd59c471'
          found="$(git ls-remote origin refs/pull/228/head | awk '{print $1}')"
          if [[ "$found" != "$expected" ]]; then
            echo '::error::G13 source head changed: do not certify a different real camera layout'
            exit 1
          fi
          git fetch --no-tags origin '+refs/pull/228/head:refs/remotes/granada/g13-original-cameras'
          test "$(git rev-parse refs/remotes/granada/g13-original-cameras)" = "$expected"
          git show "$expected:desktop/src/FoamLensDesktop/frontend/v32-granada-field-cameras.js" > desktop/src/FoamLensDesktop/frontend/v32-granada-field-cameras.js
          git show "$expected:tools/granada_g13_field_cameras.test.cjs" > tools/granada_g13_field_cameras.test.cjs
          node --check desktop/src/FoamLensDesktop/frontend/v32-granada-field-cameras.js
          node --test tools/granada_g13_field_cameras.test.cjs
          node --test tools/test_granada_g13_native_camera_assert.cjs
          node tools/granada_g13_native_camera_assert.cjs
          echo 'Original B13 Windows scientific Field and G13 original seven-camera geometry assertions now both mandatory'
      - name: G14 P0 passive per-condition Play metrics in disposable native host only
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/granada_g14_native_play_telemetry.cjs
          node --test tools/test_granada_g14_native_play_telemetry.cjs
          node tools/granada_g14_native_play_telemetry.cjs
          grep -Fq 'const playNativeTelemetry=' desktop/src/FoamLensDesktop/Program.cs
          grep -Fq 'playNotCollapsed&&cachePopoverValid&&g13NativeCameraPass' desktop/src/FoamLensDesktop/Program.cs
          echo 'G14 original Play contract unchanged; individual subconditions now measured by WebView2'
      - name: Pin G16 original measured 70px Play cascade fix into temporary native host
        shell: bash
        run: |
          set -euo pipefail
          expected='225f66ae6311e102eb5d40b9222b93d8a6b2d704'
          found="$(git ls-remote origin refs/pull/234/head | awk '{print $1}')"
          if [[ "$found" != "$expected" ]]; then
            echo '::error::G16 PR #234 source SHA drifted: exact original Play fix invalidated'
            exit 1
          fi
          git fetch --no-tags origin '+refs/pull/234/head:refs/remotes/granada/g16-play'
          test "$(git rev-parse refs/remotes/granada/g16-play)" = "$expected"
          git show "$expected:desktop/src/FoamLensDesktop/frontend/v33-granada-wide-play-cascade-guard.js" > desktop/src/FoamLensDesktop/frontend/v33-granada-wide-play-cascade-guard.js
          git show "$expected:tools/granada_g16_wide_play_cascade.test.cjs" > tools/granada_g16_wide_play_cascade.test.cjs
          node --check desktop/src/FoamLensDesktop/frontend/v33-granada-wide-play-cascade-guard.js
          node --test tools/granada_g16_wide_play_cascade.test.cjs
          node --test tools/test_granada_g16_native_play_audit.cjs
          node tools/granada_g16_native_play_audit.cjs
          grep -Fq 'playNotCollapsed&&cachePopoverValid&&g13NativeCameraPass&&g16NativePlayPass' desktop/src/FoamLensDesktop/Program.cs
          echo 'Original G7 compact + G12 wide + G13 camera + G16 Play cascade now staged without weakening physics'
      - name: Bundle original desktop with all science/CAD/Field F1 source modules and safe host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bundle='desktop/src/FoamLensDesktop/AppBundle.zip'
          $tmp='granada-native-host-bundle-tmp'
          if (Test-Path $bundle) { throw 'Original bundle unexpectedly present in source checkout' }
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/index.html' (Join-Path $tmp 'index.html')
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/v*-*.js' $tmp
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/assets' (Join-Path $tmp 'assets') -Recurse
          Copy-Item 'desktop/LICENSE.txt' (Join-Path $tmp 'LICENSE.txt')
          Compress-Archive -Path "$tmp/*" -DestinationPath $bundle -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $bundle))
          try {
            $names=@($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('index.html','v14-field-view.js','v14-z-field-compare.js',
              'v24-cad-surface-inspector.js','v24-equivalent-observables.js','v24-checkmesh-region-evidence.js',
              'v16-multipanel-export.js','v27-granada-compact-workbench.js','v28-granada-compact-timeseries.js',
              'v29-granada-plot-toolbar.js','v30-granada-chart-focus.js','v31-granada-wide-field-ribbon.js','v32-granada-field-cameras.js','v33-granada-wide-play-cascade-guard.js')) {
              if ($names -notcontains $required) { throw "Required original module missing: $required" }
            }
            $staged=@($names | Where-Object { $_ -like 'v24-*.js' }).Count
            if ($staged -lt 15) { throw "Missing scientific modules: $staged" }
            Write-Host "Native bundle has $staged scientific/UX modules plus source-backed Field F1"
          } finally { $zip.Dispose() }
      - name: Prove native AppBundle contains exact T1 provenance module before Windows launch
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $archive=[IO.Compression.ZipFile]::OpenRead((Resolve-Path 'desktop/src/FoamLensDesktop/AppBundle.zip'))
          try {
            $item=$archive.GetEntry('v14-dual-timeseries.js')
            if (-not $item) { throw 'Merged T1 original frontend module missing from native AppBundle' }
            $stream=[IO.StreamReader]::new($item.Open())
            try { $content=$stream.ReadToEnd() } finally { $stream.Dispose() }
            foreach ($required in @('function tsdSourceEvidence(', 'function tsdUpdateScientificEvidence(', 'Column ')) {
              if (-not $content.Contains($required)) { throw "Missing merged T1 native source contract: $required" }
            }
            Write-Host 'The exact staged T1 source is present in the real Windows WebView2 AppBundle'
          } finally { $archive.Dispose() }
      - name: Prove G10 native package includes ORIGINAL out-of-plot toolbar and no duplicate actions
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path 'desktop/src/FoamLensDesktop/AppBundle.zip'))
          try {
            $entry=$zip.GetEntry('v29-granada-plot-toolbar.js')
            if (-not $entry) { throw 'G10 real native AppBundle is missing original UI module' }
            $reader=[IO.StreamReader]::new($entry.Open())
            try { $content=$reader.ReadToEnd() } finally { $reader.Dispose() }
            foreach ($required in @('function restore()', 'function move()', "tools.parentNode!==originalParent", 'window.FoamLensGranadaG10')) {
              if (-not $content.Contains($required)) { throw "G10 native module missing original DOM safety assertion: $required" }
            }
            Write-Host 'G10 original source is in native package; preview/pin control identity retained'
          } finally { $zip.Dispose() }
      - name: Assert G11 accessible chart focus code exists in real native package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path 'desktop/src/FoamLensDesktop/AppBundle.zip'))
          try {
