name: Granada REAL B13 — Field F1 CAD 2D/3D physical Windows QA

on:
  push:
    branches: [feat/granada-177-real-openfoam-fieldf1-qa-20261020]

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare-real-fixture:
    name: Preserve original measured QuickCup metal/mold B13 fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove source copier and native evidence checks reject synthetic success
        run: |
          python tools/test_granada_prepare_real_openfoam_b13.py
          python tools/test_granada_real_case_native_gate.py
      - name: Require private original B13 access or fail explicitly
        env:
          HAS_QUICKCUP: ${{ secrets.QUICKCUP_FIXTURE_TOKEN != '' }}
        shell: bash
        run: |
          if [[ "$HAS_QUICKCUP" != "true" ]]; then
            echo "::error::QuickCup fixture token absent; real Field F1 cannot be marked validated"
            exit 1
          fi
      - name: Fetch original physical OpenFOAM QuickCup B13 fixture
        uses: actions/checkout@v4
        with:
          repository: realmichelduarte/QuickCup-Solidification
          ref: foamlens-real-fixture-b13
          token: ${{ secrets.QUICKCUP_FIXTURE_TOKEN }}
          persist-credentials: false
          path: quickcup-fixture
          sparse-checkout: cases_controlled_buoyancy
      - name: Original OpenFOAM case integration test, no mock data
        run: node desktop/tests/openfoam-integration.test.cjs quickcup-fixture/cases_controlled_buoyancy
      - name: Build five real B13 backed physical Windows cases with measured hashes
        run: |
          python tools/granada_prepare_real_openfoam_b13.py \
            --source quickcup-fixture/cases_controlled_buoyancy/B13_prghPressure_airGapOF14 \
            --destination multi-case-runtime-windows \
            --manifest multi-case-runtime-windows/granada_b13_manifest.json
      - name: Transfer measured source only to trusted Windows job (one day)
        uses: actions/upload-artifact@v4
        with:
          name: Granada-Original-B13-RealCase
          path: multi-case-runtime-windows/
          retention-days: 1
          if-no-files-found: error

  original-native-contracts:
    name: Pinned native/Field CAD scientific suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run canonical full main test manifest BEFORE staging extra original owner tests
        shell: bash
        run: node desktop/tests/test-suite-manifest.test.cjs
      - name: Confirm original main Field comparison regression BEFORE staging new source signature
        shell: bash
        run: node desktop/tests/field-compare.test.cjs
      - name: Verify exact-source host graft and existing 16-PR source guards
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_granada_native_host_composite.cjs
          node tools/test_granada_composite_candidate.cjs
          node tools/test_granada_science_native_host_gate.cjs
          node tools/test_granada_science_suite_registry.cjs
      - name: Assemble exact 16 science/CAD/UX PR owner JS and tests
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/granada_composite_candidate.cjs \
            --manifest tools/granada_composite_manifest.json \
            --root . --report artifacts/granada-native-g0g6-science-16-owners.json
      - name: Stage pinned ORIGINAL Field F1 v14 code and reconcile CAD + equivalent + Field native host smokes
        shell: bash
        run: |
          node tools/granada_native_host_composite.cjs \
            --report=artifacts/granada-native-host-field-cad-2d3d.json
      - name: All native Field F1 + CAD + equivalent + checkMesh original source regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            desktop/tests/field-multiregion-views.test.cjs \
            desktop/tests/field-compare.test.cjs \
            desktop/tests/field-multiview-ux.test.cjs \
            desktop/tests/cad-surface-inspector.test.cjs \
            desktop/tests/equivalent-observables.test.cjs \
            desktop/tests/checkmesh-region-evidence.spec.cjs \
            desktop/tests/checkmesh-multipanel-collision.spec.cjs \
            desktop/tests/granada-177-g23-data-analysis.spec.cjs \
            desktop/tests/granada-177-g6-export-preflight.spec.cjs \
            desktop/tests/thermocouple-xyz-mapping.spec.cjs \
            desktop/tests/multiregion-energy-conservation.spec.cjs \
            desktop/tests/solidification-front-proxy.spec.cjs \
            desktop/tests/solidification-front-tracker.test.cjs \
            desktop/tests/physics-evidence-explorer.spec.cjs \
            desktop/tests/reproducible-export.test.cjs \
            desktop/tests/section-ownership.test.cjs; do
            echo "== Original mixed source test: $suite"
            node "$suite"
          done
      - name: Verify preserved native Mesh auditor and provenance SHA checks
        shell: bash
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('desktop/src/FoamLensDesktop/Program.cs','utf8');for(const word of ['meshAuditSurfaceJson','FoamLens CAD STL/OBJ WebView2 smoke passed','FoamLens Granada equivalent-observables WebView2 smoke passed','FoamLens real OpenFOAM View B metal+mold and metric XYZ smoke passed'])if(!x.includes(word))throw Error('Missing original owner scientific guard '+word);console.log('Four independent native scientific guards all present')"
      - name: Upload source SHA provenance only; no physical dataset or binary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Granada-native-host-source-${{ matrix.os }}
          path: |
            artifacts/granada-native-g0g6-science-16-owners.json
            artifacts/granada-native-host-field-cad-2d3d.json
          if-no-files-found: warn
          retention-days: 14

  windows-native-composite:
    name: Actual Windows WebView2 — Field F1 CAD and 2D/3D, original Mesh auditor retained
    needs: [original-native-contracts, prepare-real-fixture]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download physically measured B13 metal and mold cases
        uses: actions/download-artifact@v4
        with:
          name: Granada-Original-B13-RealCase
          path: quickcup-runtime-fixture
      - name: Reverify original metal/mold time files by SHA on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content 'quickcup-runtime-fixture/granada_b13_manifest.json' -Raw | ConvertFrom-Json
          if ($m.schema -ne 'FoamLens-Granada-Real-OpenFOAM-B13-v1' -or $m.case_names.Count -ne 5) {
            throw 'B13 case provenance or original case count invalid'
          }
          foreach ($name in $m.case_names) {
            foreach ($rel in @('0/metal/T','0/mold/T','9.8/metal/T','9.8/mold/T')) {
              $path=Join-Path (Join-Path 'quickcup-runtime-fixture' $name) $rel
              if ($name -eq 'SmokeCase_Asymmetric' -and $rel -eq '9.8/mold/T') {
                if (Test-Path $path) { throw 'Fabricated mold frame present in asymmetric case' }
                continue
              }
              if (-not (Test-Path $path)) { throw "Missing real measured temperature $name/$rel" }
              $expected=$m.required_file_sha256.PSObject.Properties[$rel].Value
              if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
                throw "Measured case values changed $name/$rel"
              }
            }
          }
          Write-Host 'B13 original measured metal/mold SHA verified across five case identities'
      - name: Recheck all live SHA refs before bundling original modules
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/granada_composite_candidate.cjs \
            --manifest tools/granada_composite_manifest.json \
            --root . --report artifacts/granada-full-native-16-owners.json
          node tools/granada_native_host_composite.cjs \
            --report=artifacts/granada-native-host-reconciliation.json
      - name: Bundle original desktop with all science/CAD/Field F1 source modules and safe host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bundle='desktop/src/FoamLensDesktop/AppBundle.zip'
          $tmp='granada-native-host-bundle-tmp'
          if (Test-Path $bundle) { throw 'Original bundle unexpectedly present in source checkout' }
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/index.html' (Join-Path $tmp 'index.html')
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/v*-*.js' $tmp
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/assets' (Join-Path $tmp 'assets') -Recurse
          Copy-Item 'desktop/LICENSE.txt' (Join-Path $tmp 'LICENSE.txt')
          Compress-Archive -Path "$tmp/*" -DestinationPath $bundle -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $bundle))
          try {
            $names=@($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('index.html','v14-field-view.js','v14-z-field-compare.js',
              'v24-cad-surface-inspector.js','v24-equivalent-observables.js','v24-checkmesh-region-evidence.js',
              'v16-multipanel-export.js')) {
              if ($names -notcontains $required) { throw "Required original module missing: $required" }
            }
            $staged=@($names | Where-Object { $_ -like 'v24-*.js' }).Count
            if ($staged -lt 15) { throw "Missing scientific modules: $staged" }
            Write-Host "Native bundle has $staged scientific/UX modules plus source-backed Field F1"
          } finally { $zip.Dispose() }
      - name: Build real original Windows FoamLens Forms/WebView2 host with combined Program.cs
        shell: pwsh
        run: |
          dotnet restore 'desktop/src/FoamLensDesktop/FoamLensDesktop.csproj' -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Windows native restore failed' }
          dotnet build 'desktop/src/FoamLensDesktop/FoamLensDesktop.csproj' -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Combined three-owner C# host build failed' }
      - name: Run real QuickCup B13 View B metal mold physical XYZ native smoke
        shell: pwsh
        env:
          FOAMLENS_BRAND_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/granada-native-host-ui
          FOAMLENS_SMOKE_LAUNCH_SCREENSHOT: ${{ github.workspace }}/artifacts/granada-native-host-launch.png
          FOAMLENS_SMOKE_MIN_CASES: '4'
          FOAMLENS_SMOKE_INITIAL_CASE: SmokeCase_A
          FOAMLENS_SMOKE_SWITCH_CASE: B13_prghPressure_airGapOF14
          FOAMLENS_SMOKE_REGION: metal
          FOAMLENS_SMOKE_EXPECT_REGIONS: 'metal;mold'
          FOAMLENS_SMOKE_ASYMMETRIC_CASE: SmokeCase_Asymmetric
          FOAMLENS_SMOKE_FIELD: T
          FOAMLENS_SMOKE_TIME: '9.8'
          FOAMLENS_SMOKE_MIN_FIELD_SPAN: '1'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path 'artifacts/granada-native-host-ui' -Force | Out-Null
          $env:FOAMLENS_SMOKE_OPENFOAM_CASE=(Resolve-Path 'quickcup-runtime-fixture').Path
          $env:FOAMLENS_SMOKE_SOURCE_SHA=(git rev-parse HEAD)
          $exe='desktop/src/FoamLensDesktop/bin/Release/net8.0-windows/win-x64/FoamLens.exe'
          if (-not (Test-Path $exe)) { throw 'Real OpenFOAM native executable missing' }
          $log=Join-Path $env:LOCALAPPDATA 'FoamLens\Desktop\foamlens-desktop.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $proc=Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(480000)) {
            try { $proc.Kill($true) } catch {}
            throw 'Native real metal/mold Field F1 smoke timed out'
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 90 }
            throw "Real physical B13 View B native smoke failed $($proc.ExitCode)"
          }
          if (-not (Test-Path $log)) { throw 'Native B13 smoke log missing' }
          Copy-Item $log 'artifacts/granada-b13-real-case.log'
          python tools/granada_real_case_native_gate.py --log artifacts/granada-b13-real-case.log --fixture-manifest quickcup-runtime-fixture/granada_b13_manifest.json --field-screenshot artifacts/granada-native-host-ui/field-real-multiregion.png --output artifacts/granada-b13-fieldf1-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Real physical OpenFOAM Field F1 / View B validation FAILED' }
          Write-Host 'Measured QuickCup B13 OpenFOAM View B metal/mold physical XYZ PASS; no release'

      - name: Retain source proof, Windows screenshots and diagnostics, never installers
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Granada-field-cad-observable-native-evidence
          path: |
            artifacts/granada-full-native-16-owners.json
            artifacts/granada-native-host-reconciliation.json
            artifacts/granada-b13-fieldf1-verification.json
            artifacts/granada-b13-real-case.log
            artifacts/granada-native-host-launch.png
            artifacts/granada-native-host-ui/
          if-no-files-found: warn
          retention-days: 14
