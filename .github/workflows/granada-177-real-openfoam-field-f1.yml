          FOAMLENS_SMOKE_LAUNCH_SCREENSHOT: ${{ github.workspace }}/artifacts/granada-native-host-launch.png
          FOAMLENS_SMOKE_MIN_CASES: '4'
          FOAMLENS_SMOKE_INITIAL_CASE: SmokeCase_A
          FOAMLENS_SMOKE_SWITCH_CASE: B13_prghPressure_airGapOF14
          FOAMLENS_SMOKE_REGION: metal
          FOAMLENS_SMOKE_EXPECT_REGIONS: 'metal;mold'
          FOAMLENS_SMOKE_ASYMMETRIC_CASE: SmokeCase_Asymmetric
          FOAMLENS_SMOKE_FIELD: T
          FOAMLENS_SMOKE_TIME: '9.8'
          FOAMLENS_SMOKE_MIN_FIELD_SPAN: '1'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path 'artifacts/granada-native-host-ui' -Force | Out-Null
          $env:FOAMLENS_SMOKE_OPENFOAM_CASE=(Resolve-Path 'quickcup-runtime-fixture').Path
          $env:FOAMLENS_SMOKE_SOURCE_SHA=(git rev-parse HEAD)
          $exe='desktop/src/FoamLensDesktop/bin/Release/net8.0-windows/win-x64/FoamLens.exe'
          if (-not (Test-Path $exe)) { throw 'Real OpenFOAM native executable missing' }
          $log=Join-Path $env:LOCALAPPDATA 'FoamLens\Desktop\foamlens-desktop.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $proc=Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(480000)) {
            try { $proc.Kill($true) } catch {}
            throw 'Native real metal/mold Field F1 smoke timed out'
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 90 }
            throw "Real physical B13 View B native smoke failed $($proc.ExitCode)"
          }
          if (-not (Test-Path $log)) { throw 'Native B13 smoke log missing' }
          Copy-Item $log 'artifacts/granada-b13-real-case.log'
          python tools/granada_real_case_native_gate.py --log artifacts/granada-b13-real-case.log --fixture-manifest quickcup-runtime-fixture/granada_b13_manifest.json --field-screenshot artifacts/granada-native-host-ui/field-real-multiregion.png --output artifacts/granada-b13-fieldf1-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Real physical OpenFOAM Field F1 / View B validation FAILED' }
          Write-Host 'Measured QuickCup B13 OpenFOAM View B metal/mold physical XYZ PASS; no release'

