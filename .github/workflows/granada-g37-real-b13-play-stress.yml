name: G37 real private QuickCup B13 six original Installed and Portable Play cycles - no release
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/granada-g37-real-b13-play-stress.yml'
      - 'tools/granada_g37_real_b13_stress_guards.test.cjs'
  push:
    branches:
      - main
      - test/granada-g37-real-b13-six-native-play-restarts-20261026
      - fix/granada-g40-g37-live-main-reentry-20261027
      - fix/granada-g42-file-steward-main-drift-20261027
    # Avoid 400MB original B13 smoke on metadata-only File Steward commits.
    # Automatically verify real, newly merged Play/Field and original G37 QA sources.
    paths:
      - '.github/workflows/granada-g37-real-b13-play-stress.yml'
      - 'tools/granada_g37_real_b13_play_stress.ps1'
      - 'tools/granada_g37_real_b13_stress_guards.test.cjs'
      - 'desktop/tests/granada-176-timeseries-ui.spec.cjs'
      - 'desktop/src/FoamLensDesktop/frontend/v24-granada-timeseries-t2.js'
      - 'desktop/src/FoamLensDesktop/Program.cs'
      - 'desktop/src/FoamLensDesktop/frontend/v14-zz-field-workspace.js'
      - 'desktop/src/FoamLensDesktop/frontend/v31-granada-wide-field-ribbon.js'
      - 'desktop/src/FoamLensDesktop/frontend/v32-granada-field-cameras.js'
      - 'desktop/src/FoamLensDesktop/frontend/v33-granada-wide-play-cascade-guard.js'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: foamlens-g37-real-native-B13-Play
  cancel-in-progress: true
jobs:
  fail-closed-source-regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Negative proof that real 3+3 B13 process and all original Play geometry thresholds stay mandatory
        run: node --test tools/granada_g37_real_b13_stress_guards.test.cjs
      - name: G55 original Time Series and Field ownership source regressions (both OS)
        run: |
          node desktop/tests/granada-176-timeseries-ui.spec.cjs
          node desktop/tests/section-ownership.test.cjs
      - name: Native Windows QA harness syntax and private-data safety
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors=$null
          $tokens=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/granada_g37_real_b13_play_stress.ps1').Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message };throw 'G37 native real B13 test harness cannot parse'}
  six-genuine-native-windows-B13:
    if: ${{ github.event_name != 'pull_request' }}
    needs: fail-closed-source-regression
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify EXACT current merged G35/Field main source, current test SHA and no product-source edits
        run: |
          $sha=(git rev-parse HEAD).Trim()
          if($sha -ne '${{ github.sha }}' -or $sha -notmatch '^[a-f0-9]{40}$'){throw 'G37 exact source HEAD mismatch'}
          # G40: official main may contain newer merged product commits.
          # QA branches still may edit ONLY their explicit QA/doc owner files.
          $runRef='${{ github.ref }}'
          $currentMain=((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if($currentMain -notmatch '^[a-f0-9]{40}$'){throw 'G37 cannot identify live main; fail closed'}
          if($runRef -eq 'refs/heads/main'){
            if($sha -ne $currentMain){
              # G42: only trusted File Steward metadata-only [skip ci] commits
              # may postdate the exact native source snapshot. Never waive
              # original application, CAD, CFD, Windows Setup or Play checks.
              git fetch --no-tags origin main
              if($LASTEXITCODE -ne 0){throw 'G42 cannot fetch current main lineage'}
              $fetchedMain=(git rev-parse origin/main).Trim()
              if($fetchedMain -ne $currentMain){throw 'G42 main changed during provenance fetch'}
              git merge-base --is-ancestor $sha $currentMain
              if($LASTEXITCODE -ne 0){throw 'G42 trigger SHA not ancestor of latest main'}
              $stewardCommits=@(git log --format=%s "$sha..$currentMain")
              if($stewardCommits.Count -lt 1 -or $stewardCommits.Count -gt 4 -or
                 @($stewardCommits | Where-Object {$_ -cne 'chore(file-steward): refresh local audit findings [skip ci]'}).Count -gt 0){
                throw 'G42 unverified main commit after native trigger'
              }
              $stewardPaths=@('docs/audits/FILE_GOVERNANCE_LOG.md',
                               'reports/file-governance/FILE_GOVERNANCE.json',
                               'reports/file-governance/FILE_GOVERNANCE.md',
                               'reports/file-governance/SUMMARY.json')
              $changedAfterSnapshot=@(git diff --name-only $sha $currentMain)
              if($changedAfterSnapshot.Count -lt 1 -or
                 @($changedAfterSnapshot | Where-Object {$_ -cnotin $stewardPaths}).Count -gt 0){
                throw 'G42 non-audit product source changed after native trigger'
              }
              $stillCurrent=((git ls-remote origin refs/heads/main) -split '\s+')[0]
              if($stillCurrent -ne $currentMain){throw 'G42 main changed after audit-only verification'}
              Write-Host 'G42 checked: only File Steward metadata advanced after original native source SHA'
            } else {
              Write-Host 'G37 exact live main source verified'
            }
          } elseif($runRef -in @('refs/heads/test/granada-g37-real-b13-six-native-play-restarts-20261026',
                               'refs/heads/fix/granada-g40-g37-live-main-reentry-20261027',
                               'refs/heads/fix/granada-g42-file-steward-main-drift-20261027')){
            $branchBase=(git merge-base HEAD origin/main).Trim()
            if($branchBase -notmatch '^[a-f0-9]{40}$'){throw 'G37 cannot identify QA branch merge base'}
            $modified=@(git diff --name-only $branchBase HEAD)
            $allowed=@('tools/granada_g37_real_b13_play_stress.ps1',
                     'tools/granada_g37_real_b13_stress_guards.test.cjs',
                     '.github/workflows/granada-g37-real-b13-play-stress.yml',
                     'docs/GRANADA_G37_REAL_B13_REPEATED_PLAY_2026-10-26.md',
                     'docs/GRANADA_G40_G37_MAIN_REENTRY_2026-10-27.md',
                     'docs/GRANADA_G42_FILE_STEWARD_MAIN_LINEAGE_2026-10-27.md',
                     '.github/workflows/granada-g27-native-culture-matrix.yml',
                     'tools/granada_g27_culture_probe/GranadaG27CultureProbe.csproj',
                     'tools/granada_g27_culture_probe/Program.cs',
                     'tools/granada_g27_native_culture_matrix.test.cjs',
                     'tools/granada_g27_windows_native_culture_matrix.ps1',
                     'docs/GRANADA_G27_SCIENTIFIC_NATIVE_WINDOWS_CULTURE_2026-10-23.md',
                     'docs/GIT_AUDIT_LOG.md',
                     'docs/audits/FILE_GOVERNANCE_LOG.md',
                     'reports/file-governance/FILE_GOVERNANCE.json',
                     'reports/file-governance/FILE_GOVERNANCE.md',
                     'reports/file-governance/SUMMARY.json')
            if(@($modified | Where-Object {$_ -notin $allowed}).Count -gt 0){throw 'G37 QA branch modifies original CAD, Field, updater or scientific product source'}
          } else {throw 'G37 unrecognized Git ref; require verified main or original QA branch'}
          if((git status --porcelain).Count -gt 0){throw 'G37 original source worktree dirty'}
          [xml]$proj=Get-Content desktop/src/FoamLensDesktop/FoamLensDesktop.csproj
          if(([string]$proj.Project.PropertyGroup.Version).Trim() -ne '1.8.10'){throw 'G37 original source version drift'}
          "G37_ACTUAL_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
      # G62: the historical hard-coded run-id expired even while the real
      # QuickCup source artifact was available from recent independent CI.
      # Resolve only official successful main builder jobs, exact SHA or
      # an ancestor differing solely in explicit QA/File Steward paths.
      - name: Resolve independently generated real QuickCup B13 fixture with strict source provenance
        env:
