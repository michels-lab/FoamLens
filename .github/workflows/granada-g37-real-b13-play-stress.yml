            'reports/file-governance/FILE_GOVERNANCE.md',
            'reports/file-governance/SUMMARY.json')
          $resolved=$false
          for($attempt=0;$attempt -lt 24 -and -not $resolved;$attempt++){
            $recent=gh api "repos/$repo/actions/workflows/build-foamlens-desktop.yml/runs?branch=main&per_page=50" | ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'G62 unable to query original independent Windows builders'}
            foreach($candidate in @($recent.workflow_runs)){
              if($candidate.name -cne 'Build FoamLens Desktop for Windows' -or
