              if($LASTEXITCODE -ne 0){throw 'G62 unable to inspect independent QuickCup builder job'}
              $sourceJobs=@($jobs.jobs | Where-Object {
                $_.name -ceq 'Real OpenFOAM QuickCup regression' -and $_.status -ceq 'completed' -and $_.conclusion -ceq 'success'
              })
              if($sourceJobs.Count -ne 1){continue}
              $artifactList=gh api "repos/$repo/actions/runs/$($candidate.id)/artifacts?per_page=100" | ConvertFrom-Json
              if($LASTEXITCODE -ne 0){throw 'G62 unable to verify original B13 artifact metadata'}
              $matches=@($artifactList.artifacts | Where-Object {
                $_.name -ceq 'QuickCup-MultiCase-Windows-runtime' -and $_.expired -eq $false -and $_.size_in_bytes -gt 100000000
              })
              if($matches.Count -ne 1){continue}
              "G37_B13_FIXTURE_RUN_ID=$($candidate.id)" | Out-File -FilePath $env:GITHUB_ENV -Append
              "G37_B13_FIXTURE_SOURCE_SHA=$($candidate.head_sha)" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host 'G62: independently generated real five-case B13 artifact available from verified product-equivalent source'
              $resolved=$true
              break
            }
            if(-not $resolved -and $attempt -lt 23){Start-Sleep -Seconds 15}
