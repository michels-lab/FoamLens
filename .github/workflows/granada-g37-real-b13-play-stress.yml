            throw 'G37 genuine independent B13 source artifact missing or expired; no fake synthetic fallback'
          }
          $caseCount=@(Get-ChildItem 'quickcup-runtime-fixture' -Directory).Count
          if($caseCount -lt 5){throw 'G37 original real five-case QuickCup expected'}
          Write-Host 'G37 original privately measured source fixture present; input values intentionally never logged or uploaded'
      - name: Compile SAME exact untouched current main real Windows single-file EXE plus original Inno Setup v1.8.10
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: resvg_py==0.5.0
          if($LASTEXITCODE -ne 0){throw 'G37 genuine original icon tooling unavailable'}
          python tools/generate_windows_icon.py
          if($LASTEXITCODE -ne 0){throw 'G37 real original Windows icon generator failed'}
          python tools/generate_windows_icon.py --check
          if($LASTEXITCODE -ne 0){throw 'G37 original brand icon mismatch'}
          $bundle='desktop/src/FoamLensDesktop/AppBundle.zip'
          if(Test-Path $bundle){Remove-Item $bundle -Force}
          New-Item -ItemType Directory -Force -Path g37-source-zip | Out-Null
          Copy-Item desktop/src/FoamLensDesktop/frontend/index.html g37-source-zip/index.html
          Copy-Item desktop/src/FoamLensDesktop/frontend/v*-*.js g37-source-zip/
          Copy-Item desktop/src/FoamLensDesktop/frontend/assets g37-source-zip/assets -Recurse -Force
          Copy-Item desktop/LICENSE.txt g37-source-zip/LICENSE.txt
          Compress-Archive -Path g37-source-zip/* -DestinationPath $bundle -CompressionLevel Optimal
          dotnet publish desktop/src/FoamLensDesktop/FoamLensDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o g37-native-publish
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'g37-native-publish/FoamLens.exe')){throw 'G37 genuine original compiled app missing'}
          choco install innosetup --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'G37 genuine original Inno compiler unavailable'}
          $iscc=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          & $iscc '/DMyAppVersion=1.8.10' "/DPublishDir=$((Resolve-Path 'g37-native-publish').Path)" desktop/installer/FoamLens.iss
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'desktop/artifacts/FoamLens-Setup-v1.8.10.exe')){
            throw 'G37 actual original Inno installer failed'
          }
      - name: Launch EXACT current merged main Windows product 3 times Portable and 3 times Installed with real private B13 Field+Play
        run: |
          ./tools/granada_g37_real_b13_play_stress.ps1 -Portable g37-native-publish/FoamLens.exe -Installer desktop/artifacts/FoamLens-Setup-v1.8.10.exe -CaseRoot quickcup-runtime-fixture -SourceSha $env:G37_ACTUAL_SHA -Report g37-sanitized/report.json
          if(-not(Test-Path g37-sanitized/report.json)){throw 'G37 genuine native six-loop field report missing'}
      - name: Require all six actual original B13 1140 and 640 Play passes with exact SHA and no fake release
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:G37_ACTUAL_SHA){throw 'G37 product source SHA drift'}
          $r=Get-Content g37-sanitized/report.json -Raw|ConvertFrom-Json
          if($r.schema -ne 'foamlens/granada-g37-actual-b13-stress/1' -or
             $r.sourceSha -ne $env:G37_ACTUAL_SHA -or
             $r.originalProductSourceUntouched -ne $true -or
             $r.completedAttempts.Count -ne 6 -or
             $r.realNativeB13SixCycleGatePassed -ne $true -or
             $r.originalInnoInstalledAndUninstalled -ne $true -or
             $r.originalProductReleaseReady -ne $false -or
             $r.humanVisual36Accepted -ne $false){
            throw 'G37 native real B13 repeat evidence not completed or false release approval'
          }
          $port=@($r.completedAttempts | Where-Object {$_.mode -eq 'portable'}).Count
          $inst=@($r.completedAttempts | Where-Object {$_.mode -eq 'installed'}).Count
          if($port -ne 3 -or $inst -ne 3){throw 'G37 real B13 original Play six-run coverage incomplete'}
          Write-Host 'G37 genuine ORIGINAL B13 Play 6/6 PASS: 1140+640px, measured mold+metal, 3 Installed+3 Portable, no release'
      - name: Preserve only sanitized boolean metadata, NEVER private B13 source, screenshots, browser profiles or unsigned installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FoamLens-G37-six-original-B13-native-Play-booleans-only
          path: g37-sanitized/report.json
          if-no-files-found: warn
          retention-days: 7
