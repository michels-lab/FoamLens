name: FoamLens Granada - repository ownership regression
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'frontend/**'
      - 'web/**'
      - 'app/**'
      - 'scripts/**'
      - 'tools/**'
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'frontend/**'
      - 'web/**'
      - 'app/**'
      - 'scripts/**'
      - 'tools/**'
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/foamlens-boundary-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-code-and-fixtures:
    name: Tracked source, tests and foreign-app boundary
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests - positive, negative and real temporary Git index
        run: node tools/test_repository_boundaries_selftest.cjs
      - name: Scan current tracked FoamLens source and fixtures (read-only)
        run: node tools/test_repository_boundaries.cjs
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Preserve source-owned scientific File Steward tests
        if: runner.os == 'Linux'
        run: python3 tools/test_repository_file_auditor.py
      - name: Verify original tracked-tree inventory remains read-only
        if: runner.os == 'Linux'
        run: python3 tools/repository_file_auditor.py --repo . --no-write
