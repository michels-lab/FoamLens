name: GRANADA all workspaces — 12 exact source owners and real Windows WebView2
on:
  pull_request:
    paths:
      - 'tools/granada_all_tabs_11_owner.cjs'
      - 'tools/granada_all_tabs_11_owner.test.cjs'
      - 'docs/GRANADA_ALL_TABS_11_OWNER_2026-10-21.md'
      - '.github/workflows/granada-all-tabs-11-owner-native.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  all-owner-source:
    name: 11-source Field+all-tabs+CtrlK integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure all-owner fail-closed negative tests
        run: node --test tools/granada_all_tabs_11_owner.test.cjs
      - name: Pin 12 live PR HEADs, preserve existing science, stage exact native source
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/granada_all_tabs_11_owner.cjs --report=artifacts/granada-all-tabs-sources.json
      - name: Verify strict original Windows suite manifest in isolated checkout
        run: node desktop/tests/test-suite-manifest.test.cjs
      - name: Exercise all original source-owned native UI behaviors in one checkout
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            desktop/tests/field-compare.test.cjs \
            desktop/tests/field-multiregion-views.test.cjs \
            desktop/tests/field-f2-runtime-interactions.spec.cjs \
            desktop/tests/field-f2-viewport-layout.spec.cjs \
            desktop/tests/granada-177-global-ux.spec.cjs \
            desktop/tests/granada-177-ux-runtime.spec.cjs \
            desktop/tests/granada-177-g4-review-live.spec.cjs \
            desktop/tests/granada-176-timeseries-ui.spec.cjs \
            desktop/tests/granada-177-g23-data-analysis.spec.cjs \
            desktop/tests/granada-177-g6-export-preflight.spec.cjs \
            desktop/tests/granada-177-g2-field-source-dock.test.cjs \
            tools/test_granada_visual_review.cjs \
            tools/granada-ui-audit/audit-diff.test.cjs \
            tools/granada_command_search.test.cjs \
            tools/granada_g7_compact_workbench.test.cjs \
            desktop/tests/ribbon-ui.test.cjs \
            desktop/tests/field-3d-navigation-cache.test.cjs \
            desktop/tests/field-multiview-ux.test.cjs \
            desktop/tests/workspace-ux.test.cjs; do
            echo "::group::ORIGINAL OWNER: $spec"
            node --test "$spec"
            echo "::endgroup::"
          done
      - name: Preserve hashes only; never upload source cases
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: all-tabs-twelve-owner-${{ matrix.os }}
          path: artifacts/granada-all-tabs-sources.json
          if-no-files-found: warn
          retention-days: 14

  native-windows:
    name: All workspaces assembled in actual FoamLens Windows/WebView2
    runs-on: windows-latest
    needs: [all-owner-source]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Re-pin owners before native build and stage all real modules
        shell: bash
        run: |
          mkdir -p artifacts
          node tools/granada_all_tabs_11_owner.cjs --report=artifacts/granada-all-tabs-native.json
          node desktop/tests/test-suite-manifest.test.cjs
      - name: Assemble real WebView2 app with all new source-owned tabs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bundle='desktop/src/FoamLensDesktop/AppBundle.zip'
          if(Test-Path $bundle){throw 'Unexpected preexisting bundle'}
          $tmp='granada-twelve-source-native'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/index.html' (Join-Path $tmp 'index.html')
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/v*-*.js' $tmp
          Copy-Item 'desktop/src/FoamLensDesktop/frontend/assets' (Join-Path $tmp 'assets') -Recurse
          Copy-Item 'desktop/LICENSE.txt' (Join-Path $tmp 'LICENSE.txt')
          Compress-Archive -Path "$tmp/*" -DestinationPath $bundle -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $bundle))
          try{
            $names=@($zip.Entries | ForEach-Object FullName)
            foreach($name in @('v14-field-view.js','v14-z-field-compare.js',
              'v24-field-f2-viewport-layout.js','v24-granada-global-ux.js',
              'v24-granada-g4-review-live.js','v24-granada-timeseries-t2.js',
              'v24-granada-g23-data-analysis.js','v24-granada-g6-export-preflight.js',
              'v25-granada-field-source-dock.js','v26-granada-command-search.js',
              'v27-granada-compact-workbench.js')){
              if($names -notcontains $name){throw "Real assembled frontend missing: $name"}
            }
          }finally{$zip.Dispose()}
      - name: Compile original C# WinForms/real WebView2 app
        shell: pwsh
        run: |
          dotnet restore desktop/src/FoamLensDesktop/FoamLensDesktop.csproj -r win-x64
          if($LASTEXITCODE -ne 0){throw 'Native restore failed'}
          dotnet build desktop/src/FoamLensDesktop/FoamLensDesktop.csproj -c Release -r win-x64 --no-restore
          if($LASTEXITCODE -ne 0){throw 'Native compile failed'}
      - name: Run actual .NET Windows executable and capture technical screenshot
        shell: pwsh
        env:
          FOAMLENS_BRAND_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/twelve-native-images
          FOAMLENS_SMOKE_LAUNCH_SCREENSHOT: ${{ github.workspace }}/artifacts/twelve-startup.png
        run: |
          $ErrorActionPreference='Stop'
          $exe='desktop/src/FoamLensDesktop/bin/Release/net8.0-windows/win-x64/FoamLens.exe'
          if(-not(Test-Path $exe)){throw 'Native executable missing'}
          New-Item -Path 'artifacts/twelve-native-images' -ItemType Directory -Force | Out-Null
          $p=Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--smoke-test' -PassThru
          if(-not $p.WaitForExit(420000)){try{$p.Kill($true)}catch{};throw 'Native smoke timed out'}
          if($p.ExitCode -ne 0){throw "Native smoke failed exit $($p.ExitCode)"}
          Write-Host 'REAL WebView2 source modules compiled and native app launched; physical OpenFOAM case and installed-DPI visual acceptance still pending'
      - name: Upload technical evidence only, never a release artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: all-tabs-twelve-owner-native-webview2
          path: |
            artifacts/granada-all-tabs-native.json
            artifacts/twelve-startup.png
            artifacts/twelve-native-images/
          if-no-files-found: warn
          retention-days: 14
