name: CAD surface scientific fast tests

on:
  push:
    paths:
      - 'desktop/src/FoamLensDesktop/NativeCadOcctConverter.cs'
      - 'desktop/src/FoamLensDesktop/NativeCadOcctFreecad.py'
      - 'desktop/src/FoamLensDesktop/FoamLensDesktop.csproj'
      - 'desktop/tests/cad-occt-native.test.cjs'
      - 'desktop/tests/cad-occt-freecad.test.py'
      - 'desktop/src/FoamLensDesktop/NativeCadSurfaceCheck.cs'
      - 'desktop/src/FoamLensDesktop/Program.cs'
      - 'desktop/tests/cad-native-surfacecheck.test.cjs'
      - 'desktop/src/FoamLensDesktop/frontend/v24-cad-surface-inspector.js'
      - 'desktop/tests/cad-surface-inspector.test.cjs'
      - '.github/workflows/cad-surface-fast.yml'
  pull_request:
    paths:
      - 'desktop/src/FoamLensDesktop/NativeCadOcctConverter.cs'
      - 'desktop/src/FoamLensDesktop/NativeCadOcctFreecad.py'
      - 'desktop/src/FoamLensDesktop/FoamLensDesktop.csproj'
      - 'desktop/tests/cad-occt-native.test.cjs'
      - 'desktop/tests/cad-occt-freecad.test.py'
      - 'desktop/src/FoamLensDesktop/NativeCadSurfaceCheck.cs'
      - 'desktop/src/FoamLensDesktop/Program.cs'
      - 'desktop/tests/cad-native-surfacecheck.test.cjs'
      - 'desktop/src/FoamLensDesktop/frontend/v24-cad-surface-inspector.js'
      - 'desktop/tests/cad-surface-inspector.test.cjs'
      - '.github/workflows/cad-surface-fast.yml'
  workflow_dispatch:

jobs:
  cad-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import formats, metric safety and topology tests
        run: node desktop/tests/cad-surface-inspector.test.cjs
      - name: Native WSL surfaceCheck browser request and fail-closed tests
        run: node desktop/tests/cad-native-surfacecheck.test.cjs
      - name: FreeCAD OCCT source-owned native frontend, cancellation and provenance
        run: node desktop/tests/cad-occt-native.test.cjs
      - name: Execute FreeCAD conversion script under controlled mock Part API (NOT actual OCCT)
        run: python3 desktop/tests/cad-occt-freecad.test.py
