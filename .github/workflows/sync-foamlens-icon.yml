name: Sync FoamLens arc-free Windows icon

on:
  workflow_dispatch:
  push:
    branches:
      - 'design/**'
      - 'development/**'
      - 'branding/**'
      - 'fix/**'
    paths:
      - 'desktop/src/FoamLensDesktop/frontend/assets/branding/official-app-icon.svg'
      - 'tools/generate_windows_icon.py'
      - '.github/workflows/sync-foamlens-icon.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: foamlens-icon-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Commit exact SVG-derived Windows icon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lossless SVG renderer
        run: python -m pip install --disable-pip-version-check --only-binary=:all: resvg_py==0.5.0
      - name: Generate and verify full-resolution icon
        run: |
          python tools/generate_windows_icon.py
          python tools/generate_windows_icon.py --check
          node desktop/tests/windows-icon.test.cjs
      - name: Commit derivative and dispatch exact-head Windows/Store checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          icon='desktop/src/FoamLensDesktop/Assets/FoamLens.ico'
          if git diff --quiet -- "$icon"; then
            echo 'Canonical SVG and Windows ICO already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$icon"
          git commit -m 'build(branding): sync FoamLens.ico from arc-free source SVG'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'Regenerated binary icon committed. Dispatching current-head candidate verification.'
          gh workflow run build-foamlens-desktop.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run build-store-msix.yml --ref "${GITHUB_REF_NAME}"
