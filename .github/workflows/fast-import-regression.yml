name: FoamLens scientific fast-import regression

on:
  pull_request:
    paths:
      - 'desktop/src/FoamLensDesktop/frontend/index.html'
      - 'desktop/tests/scientific-fast-import.test.cjs'
      - 'desktop/tests/scientific-import-index.test.cjs'
      - '.github/workflows/fast-import-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'desktop/src/FoamLensDesktop/frontend/index.html'
      - 'desktop/tests/scientific-fast-import.test.cjs'
      - 'desktop/tests/scientific-import-index.test.cjs'
      - '.github/workflows/fast-import-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-import-regression:
    name: 3,008-series 2D fast import and scientific-on-demand
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Do not eagerly compute large-case scientific audit
        run: node desktop/tests/scientific-fast-import.test.cjs
      - name: Preserve physical probe matching with O(N) membership
        run: node desktop/tests/scientific-import-index.test.cjs
      - name: Verify JS syntax for actual inline frontend scripts
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('desktop/src/FoamLensDesktop/frontend/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(s=>s.trim());
          if(!scripts.length)throw Error('No source scripts found');
          scripts.forEach((script,i)=>new vm.Script(script,{filename:'FoamLens_inline_'+i+'.js'}));
          console.log('Compiled '+scripts.length+' live frontend JS scripts');
          NODE
