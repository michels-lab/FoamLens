name: Granada CAD F3 — original assembly tree and source-visible exports

on:
  push:
    paths:
      - 'desktop/src/FoamLensDesktop/frontend/v24-cad-surface-inspector.js'
      - 'desktop/tests/cad-assembly-visibility.test.cjs'
      - 'desktop/tests/cad-openfoam-staging.test.cjs'
      - 'desktop/tests/cad-openfoam-staging-ui.test.cjs'
      - '.github/workflows/granada-cad-assembly-ui.yml'
  pull_request:
    paths:
      - 'desktop/src/FoamLensDesktop/frontend/v24-cad-surface-inspector.js'
      - 'desktop/tests/cad-assembly-visibility.test.cjs'
      - 'desktop/tests/cad-openfoam-staging.test.cjs'
      - 'desktop/tests/cad-openfoam-staging-ui.test.cjs'
      - '.github/workflows/granada-cad-assembly-ui.yml'
  workflow_dispatch:

jobs:
  assembly-tree:
    name: Native CAD assembly part-tree UI — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original CAD assembly tree, parts visibility, selection, isolation, restore and source export
        run: node desktop/tests/cad-assembly-visibility.test.cjs
      - name: Foundation and OpenFOAM.com staging geometry, SI bounds, exact ZIP provenance
        run: node desktop/tests/cad-openfoam-staging.test.cjs
      - name: Original OpenFOAM target/region role interface and safe offline staging export
        run: node desktop/tests/cad-openfoam-staging-ui.test.cjs
      - name: Original CAD import, topology, units and binary STL ZIP provenance
        run: node desktop/tests/cad-surface-inspector.test.cjs
      - name: Original native WSL surfaceCheck request and visible selection
        run: node desktop/tests/cad-native-surfacecheck.test.cjs
      - name: Original FreeCAD OCCT browser import and cancellation protections
        run: node desktop/tests/cad-occt-native.test.cjs
      - name: Full Windows suite manifest still includes every source-owned regression
        run: node desktop/tests/test-suite-manifest.test.cjs
