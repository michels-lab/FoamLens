name: GRANADA G15 - exact updater checksum and official asset identity
on:
  pull_request:
    paths:
      - 'desktop/src/FoamLensDesktop/Program.cs'
      - 'desktop/src/FoamLensDesktop/UpdateAssetIntegrity.cs'
      - 'tools/granada_g15_updater_harness/**'
      - 'tools/granada_g15_updater_source.test.cjs'
      - '.github/workflows/granada-g15-updater-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater-integrity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production C# checksum and URL validation with adversarial inputs
        run: dotnet run --project tools/granada_g15_updater_harness/UpdaterHarness.csproj --configuration Release
      - name: Ensure original updater requires consent and checks exact downloaded source
        run: node --test tools/granada_g15_updater_source.test.cjs
      - name: Protect FoamLens-only code and case ownership
        run: node tools/test_repository_boundaries.cjs
