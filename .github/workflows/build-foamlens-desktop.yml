# FoamLens CI — release validation
# Branch CI validates candidates without publishing. Human visual review is performed by the owner after release; automated checks remain mandatory.
name: Build FoamLens Desktop for Windows

# Cancel superseded branch CI instead of running outdated Windows builds in parallel.
# Never cancel a release tag or main's protected validation run.
concurrency:
  group: foamlens-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the generated installer and portable EXE as a GitHub Release.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - 'development/**'
      - 'design/**'
      - 'integration/**'
      - 'release/**'
      - 'fix/**'
      - 'branding/**'
      - 'distribution/**'
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'tools/make_visual_evidence.py'
      - 'tools/generate_windows_icon.py'
      - 'tools/visual_release_gate.py'
      - '.github/workflows/build-foamlens-desktop.yml'

permissions:
  contents: write
  actions: write

env:
  HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
  HAS_QUICKCUP_FIXTURE: ${{ secrets.QUICKCUP_FIXTURE_TOKEN != '' }}

jobs:
  quickcup-regression:
    name: Real OpenFOAM QuickCup regression
    runs-on: ubuntu-latest
    env:
      QUICKCUP_FIXTURE_TOKEN: ${{ secrets.QUICKCUP_FIXTURE_TOKEN }}
    steps:
      - name: Fixture token unavailable
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN == '' }}
        run: echo "QUICKCUP_FIXTURE_TOKEN is not configured; real OpenFOAM fixture regression is skipped."

      - name: Checkout FoamLens
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Checkout private OpenFOAM regression fixture
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: realmichelduarte/QuickCup-Solidification
          ref: foamlens-real-fixture-b13
          token: ${{ env.QUICKCUP_FIXTURE_TOKEN }}
          path: quickcup-fixture
          sparse-checkout: cases_controlled_buoyancy

      - name: Test real OpenFOAM fixture integration
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        run: node desktop/tests/openfoam-integration.test.cjs quickcup-fixture/cases_controlled_buoyancy

      - name: Install VTK streamline reference runtime
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --upgrade pip
          python3 -m pip install --disable-pip-version-check vtk

      - name: Validate B13 streamlines against VTK
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case_root="quickcup-fixture/cases_controlled_buoyancy/B13_prghPressure_airGapOF14"
          mkdir -p vtk-validation
          node desktop/tests/streamline-vtk-reference-input.cjs "$case_root" vtk-validation/foamlens-streamlines.json 9.8
          python3 desktop/tests/vtk_streamline_reference.py "$case_root" vtk-validation/foamlens-streamlines.json vtk-validation/vtk-streamline-report.json
          cat vtk-validation/vtk-streamline-report.json

      - name: Upload VTK streamline validation evidence
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FoamLens-VTK-streamline-validation
          path: vtk-validation/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Windows-safe multi-case 3D runtime fixture
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, re

          # The committed regression branch contains one complete transient
          # 3D fixture (B13). Other V12/V13 directories intentionally omit
          # generated polyMesh payloads, so selector mechanics are tested with
          # distinct case identities backed by the same complete real fixture.
          src = Path("quickcup-fixture/cases_controlled_buoyancy/B13_prghPressure_airGapOF14")
          case_names = [
              "SmokeCase_A",
              "SmokeCase_B",
              "SmokeCase_C",
              "B13_prghPressure_airGapOF14",
          ]
          dst_root = Path("multi-case-runtime-windows")
          if dst_root.exists():
              shutil.rmtree(dst_root)
          dst_root.mkdir(parents=True)

          invalid = re.compile(r'[<>:"\\|?*]')
          reserved = {
              "CON","PRN","AUX","NUL",
              *{f"COM{i}" for i in range(1,10)},
              *{f"LPT{i}" for i in range(1,10)}
          }

          copied_files = []
          skipped = 0
          for path in sorted(src.rglob("*")):
              rel = path.relative_to(src)
              bad = False
              for part in rel.parts:
                  stem = part.split(".", 1)[0].upper()
                  if invalid.search(part) or part.rstrip(" .") != part or stem in reserved:
                      bad = True
                      break
              if bad:
                  skipped += 1
                  continue
              if path.is_file():
                  copied_files.append(rel)

          for case_name in case_names:
              dst = dst_root / case_name
              dst.mkdir(parents=True)
              for rel in copied_files:
                  source = src / rel
                  target = dst / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
              required = [
                  dst / "constant" / "metal" / "polyMesh" / "points",
                  dst / "constant" / "metal" / "polyMesh" / "faces",
                  dst / "constant" / "metal" / "polyMesh" / "owner",
                  dst / "0" / "metal" / "T",
              ]
              missing = [str(p.relative_to(dst)) for p in required if not p.exists()]
              if missing:
                  raise SystemExit(f"Windows-safe {case_name} fixture lost required 3D inputs: " + ", ".join(missing))

          print(f"Windows-safe multi-case fixture: {len(case_names)} case identities backed by complete B13; {len(copied_files)} files each; {skipped} invalid paths omitted.")
          PY

      - name: Upload Windows-safe multi-case 3D runtime fixture
        if: ${{ env.QUICKCUP_FIXTURE_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickCup-MultiCase-Windows-runtime
          path: multi-case-runtime-windows/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: quickcup-regression
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows-safe multi-case 3D runtime fixture
        if: ${{ env.HAS_QUICKCUP_FIXTURE == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: QuickCup-MultiCase-Windows-runtime
          path: quickcup-runtime-fixture

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve FoamLens version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$proj = Get-Content 'desktop/src/FoamLensDesktop/FoamLensDesktop.csproj'
            $v = ([string]$proj.Project.PropertyGroup.Version).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'FoamLens version could not be resolved.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building FoamLens v$v"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate canonical arc-free Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: resvg_py==0.5.0
          python tools/generate_windows_icon.py
          python tools/generate_windows_icon.py --check

      - name: Rebuild embedded frontend bundle
        shell: pwsh
        run: |
          $bundle='desktop/src/FoamLensDesktop/AppBundle.zip'
          if (Test-Path $bundle) { Remove-Item $bundle -Force }
          New-Item -ItemType Directory -Force bundle_tmp | Out-Null
          Copy-Item desktop/src/FoamLensDesktop/frontend/index.html bundle_tmp/index.html
          Copy-Item desktop/src/FoamLensDesktop/frontend/v*-*.js bundle_tmp/
          Copy-Item desktop/src/FoamLensDesktop/frontend/assets bundle_tmp/assets -Recurse -Force
          Copy-Item desktop/LICENSE.txt bundle_tmp/LICENSE.txt
          Compress-Archive -Path bundle_tmp/* -DestinationPath $bundle -CompressionLevel Optimal

      - name: Verify FoamLens frontend
        shell: pwsh
        run: |
          if (-not (Select-String -Path 'desktop/src/FoamLensDesktop/frontend/index.html' -Pattern 'FoamLens v51' -Quiet)) {
            throw 'Desktop frontend is not FoamLens v51.'
          }

      - name: Verify embedded frontend bundle integrity
        shell: pwsh
        run: |
          $bundle='desktop/src/FoamLensDesktop/AppBundle.zip'
          $verify='bundle_verify'
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          Expand-Archive -Path $bundle -DestinationPath $verify -Force
          $source='desktop/src/FoamLensDesktop/frontend/index.html'
          $packed=Join-Path $verify 'index.html'
          if (-not (Test-Path $packed)) { throw 'AppBundle.zip does not contain root index.html.' }
          $sourceHash=(Get-FileHash $source -Algorithm SHA256).Hash
          $packedHash=(Get-FileHash $packed -Algorithm SHA256).Hash
          if ($sourceHash -ne $packedHash) { throw "AppBundle index hash mismatch: source=$sourceHash packed=$packedHash" }
          if ((Get-Item $packed).Length -lt 100000) { throw 'Packed FoamLens index.html is unexpectedly small.' }
          if (-not (Select-String -Path $packed -Pattern 'id="launchTitle">FoamLens</h1>' -Quiet)) {
            throw 'Packed FoamLens index.html lost the launch surface.'
          }
          foreach ($asset in @(
            'assets/branding/michel-duarte-avatar.jpg',
            'assets/branding/michels-lab/official-lockup.png',
            'assets/branding/official-lockup.svg'
          )) {
            if (-not (Test-Path (Join-Path $verify $asset))) { throw "AppBundle.zip is missing $asset" }
          }
          $portraitSha=(git hash-object 'desktop/src/FoamLensDesktop/frontend/assets/branding/michel-duarte-avatar.jpg').Trim()
          if ($portraitSha -ne '18fe1a68722850c3d8f918dc0799f46ffeb6dbaf') { throw "Canonical Michel portrait drifted: $portraitSha" }
          $labSha=(git hash-object 'desktop/src/FoamLensDesktop/frontend/assets/branding/michels-lab/official-lockup.png').Trim()
          if ($labSha -ne '7fd48093968b31ddacd3098f5b15d962de580652') { throw "Canonical Michel's Lab lockup drifted: $labSha" }
          if (Select-String -Path 'desktop/src/FoamLensDesktop/frontend/index.html' -Pattern 'src="data:image/jpeg;base64,' -Quiet) {
            throw 'About portrait must remain a file reference; data-URI embedding is forbidden.'
          }
          Write-Host "Validated AppBundle.zip root index and canonical About/product assets; index SHA-256 $packedHash"

      - name: Compile Windows host before regression suite
        shell: pwsh
        run: |
          dotnet restore desktop/src/FoamLensDesktop/FoamLensDesktop.csproj -r win-x64
          dotnet build desktop/src/FoamLensDesktop/FoamLensDesktop.csproj -c Release -r win-x64 --self-contained true --no-restore

      - name: Validate FoamLens frontend JavaScript
        shell: pwsh
        run: |
          @'
          const fs=require('fs');
          const file='desktop/src/FoamLensDesktop/frontend/index.html';
          const html=fs.readFileSync(file,'utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
          if(!scripts.length)throw new Error('No inline scripts found in FoamLens frontend.');
          scripts.forEach((m,i)=>{try{new Function(m[1])}catch(e){throw new Error('Inline script '+i+' failed syntax validation: '+e.message)}});
          const extDir='desktop/src/FoamLensDesktop/frontend';
          const extensions=fs.readdirSync(extDir).filter(name=>/^v\d+-.*\.js$/i.test(name));
          extensions.forEach(name=>{const src=fs.readFileSync(extDir+'/'+name,'utf8');try{new Function(src)}catch(e){throw new Error(name+' failed syntax validation: '+e.message)}});
          if(!html.includes("window.chrome.webview.addEventListener('message'"))throw new Error('FoamLens native WebView2 bridge is missing.');
          for(const fragment of ['parseOpenFOAMRunLogRecords','parseOpenFOAMRunLogFile',"return'runlog'","path:'solver run log'"]){
            if(!html.includes(fragment))throw new Error('Raw OpenFOAM solver-log support missing: '+fragment);
          }
          for(const id of ['launchFolder','launchFiles','launchWorkspace']){
            if(!html.includes("$('"+id+"')"))throw new Error('Launch control wiring missing: '+id);
          }
          console.log('Validated '+scripts.length+' inline FoamLens script blocks, '+extensions.length+' versioned frontend modules, and launch controls.');
          '@ | Set-Content -Path validate-foamlens-frontend.js -Encoding utf8
          node validate-foamlens-frontend.js

      - name: Test Spatial Profiles physical-time playback
        shell: pwsh
        run: node desktop/tests/profile-playback.test.cjs

      - name: Test Phase Change / Momentum analysis
        shell: pwsh
        run: node desktop/tests/phase-momentum.test.cjs

      - name: Test general OpenFOAM discovery model
        shell: pwsh
        run: node desktop/tests/discovery-model.test.cjs

      - name: Test OpenFOAM dimensions and SI-unit interpretation
        shell: pwsh
        run: node desktop/tests/dimensions-units.test.cjs

      - name: Test derived Data Catalog provenance
        shell: pwsh
        run: node desktop/tests/derived-catalog.test.cjs

      - name: Test reproducible selected-series exports
        shell: pwsh
        run: node desktop/tests/reproducible-export.test.cjs

      - name: Test temporal alignment and quantitative differences
        shell: pwsh
        run: node desktop/tests/temporal-alignment.test.cjs

      - name: Test quantitative spatial profile differences
        shell: pwsh
        run: node desktop/tests/spatial-differences.test.cjs

      - name: Test numerical performance and solver-log analysis
        shell: pwsh
        run: node desktop/tests/numerical-performance.test.cjs

      - name: Test neutral general case comparison
        shell: pwsh
        run: node desktop/tests/general-case-comparison.test.cjs

      - name: Test general derived physical analysis
        shell: pwsh
        run: node desktop/tests/physical-analysis.test.cjs

      - name: Test general Flow Analysis
        shell: pwsh
        run: node desktop/tests/flow-analysis.test.cjs

      - name: Test solidification and remelting analysis
        shell: pwsh
        run: node desktop/tests/solidification-analysis.test.cjs

      - name: Test general Thermal Analysis
        shell: pwsh
        run: node desktop/tests/thermal-analysis.test.cjs

      - name: Test expanded general Field Mapping
        shell: pwsh
        run: node desktop/tests/field-mapping.test.cjs

      - name: Test multi-region analysis context
        shell: pwsh
        run: node desktop/tests/multiregion-analysis.test.cjs

      - name: Test case-name neutrality
        shell: pwsh
        run: node desktop/tests/generic-case-identity.test.cjs

      - name: Test explicit descriptive case tags
        shell: pwsh
        run: node desktop/tests/case-tags.test.cjs

      - name: Test release version consistency
        shell: pwsh
        run: node desktop/tests/version-consistency.test.cjs

      - name: Test native automatic update path
        shell: pwsh
        run: node desktop/tests/auto-update.test.cjs

      - name: Test Microsoft Store MSIX channel contract
        shell: pwsh
        run: |
          node --check desktop/tests/store-msix.test.cjs
          node desktop/tests/store-msix.test.cjs

      - name: Test native Windows icon packaging
        shell: pwsh
        run: node desktop/tests/windows-icon.test.cjs

      - name: Test official FoamLens product identity
        shell: pwsh
        run: node desktop/tests/official-branding.test.cjs

      - name: Guard product code from regression-fixture names
        shell: pwsh
        run: |
          @'
          const fs=require('fs'),path=require('path');
          const dir='desktop/src/FoamLensDesktop/frontend';
          const files=fs.readdirSync(dir).filter(name=>name==='index.html'||/^v\d+-.*\.js$/i.test(name));
          const banned=['QuickCup','B3_reference','B4_energy2','B5_outer3','B6_adaptiveDt','B7_outer4','C3_reference','C4_energy2','C5_outer3','C6_adaptiveDt','C7_outer4'];
          const hits=[];
          for(const file of files){
            const s=fs.readFileSync(path.join(dir,file),'utf8');
            for(const token of banned)if(s.includes(token))hits.push(file+': '+token);
          }
          if(hits.length)throw new Error('Regression-fixture names leaked into product code:\n'+hits.join('\n'));
          console.log('Product code is fixture-name neutral across '+files.length+' frontend files.');
          '@ | Set-Content -Path guard-fixture-neutrality.js -Encoding utf8
          node guard-fixture-neutrality.js

      - name: Test generic vector field derivation
        shell: pwsh
        run: node desktop/tests/vector-fields.test.cjs

      - name: Test vector glyph ROI, length semantics and scientific provenance
        shell: pwsh
        run: node desktop/tests/vector-analysis.test.cjs

      - name: Test native background progress and cancellation
        shell: pwsh
        run: node desktop/tests/native-performance.test.cjs

      - name: Test incremental Desktop temporal parsing
        shell: pwsh
        run: node desktop/tests/incremental-temporal-parser.test.cjs

      - name: Test incremental Desktop OpenFOAM field parsing
        shell: pwsh
        run: node desktop/tests/incremental-field-parser.test.cjs

      - name: Stress-test large incremental datasets
        shell: pwsh
        run: node desktop/tests/large-project-stress.test.cjs

      - name: Test native OpenFOAM field streaming
        shell: pwsh
        run: node desktop/tests/native-field-streaming.test.cjs

      - name: Test 3D OpenFOAM Field View
        shell: pwsh
        run: node desktop/tests/field-view.test.cjs

      - name: Test pointField interior slice and iso-surface reconstruction
        shell: pwsh
        run: node desktop/tests/point-interior.test.cjs

      - name: Test decomposed processor Field View
        shell: pwsh
        run: node desktop/tests/decomposed-field-view.test.cjs

      - name: Test time-varying OpenFOAM dynamic mesh
        shell: pwsh
        run: node desktop/tests/dynamic-mesh.test.cjs

      - name: Test Field View iso-surfaces
        shell: pwsh
        run: node desktop/tests/isosurface.test.cjs

      - name: Test Field View 3D probe picking
        shell: pwsh
        run: node desktop/tests/field-probe.test.cjs

      - name: Test explicit surface-field boundary patches
        shell: pwsh
        run: node desktop/tests/surface-boundary.test.cjs

      - name: Test strict 3D difference field comparison
        shell: pwsh
        run: node desktop/tests/field-compare.test.cjs

      - name: Test collapsible sidebar sections
        shell: pwsh
        run: node desktop/tests/sidebar-sections.test.cjs

      - name: Test Smart Import version grouping
        shell: pwsh
        run: node desktop/tests/smart-import-groups.test.cjs

      - name: Test dual-variable Time-Series Focus
        shell: pwsh
        run: node desktop/tests/dual-timeseries.test.cjs

      - name: Test formal convergence audit
        shell: pwsh
        run: node desktop/tests/coupling-audit.test.cjs

      - name: Test automatic momentum mechanism audit
        shell: pwsh
        run: node desktop/tests/momentum-mechanisms.test.cjs

      - name: Test automatic energy audit
        shell: pwsh
        run: node desktop/tests/energy-audit.test.cjs

      - name: Test simulation vs experiment validation
        shell: pwsh
        run: node desktop/tests/experimental-validation.test.cjs

      - name: Test capability-driven contextual UI
        shell: pwsh
        run: node desktop/tests/capability-ui.test.cjs

      - name: Test actionable diagnostics across the app
        shell: pwsh
        run: node desktop/tests/actionable-diagnostics.test.cjs

      - name: Test Findings evidence and assistant handoff
        shell: pwsh
        run: node desktop/tests/findings-export.test.cjs

      - name: Test multi-panel export and progressive performance
        shell: pwsh
        run: node desktop/tests/multipanel-performance.test.cjs

      - name: Test persistent Field Workspace UX
        shell: pwsh
        run: node desktop/tests/workspace-ux.test.cjs

      - name: Test cross-session workspace persistence
        shell: pwsh
        run: node desktop/tests/session-persistence.test.cjs

      - name: Test contextual help and resizable workspace
        shell: pwsh
        run: node desktop/tests/context-help-resize.test.cjs

      - name: Test compact ribbon navigation
        shell: pwsh
        run: node desktop/tests/ribbon-ui.test.cjs

      - name: Test stable 2D plot surfaces
        shell: pwsh
        run: node desktop/tests/plot-surfaces.test.cjs

      - name: Test section ownership and anti-leak boundaries
        shell: pwsh
        run: node desktop/tests/section-ownership.test.cjs

      - name: Test final v1.6 UX coherence audit
        shell: pwsh
        run: node desktop/tests/v16-final-ux-audit.test.cjs

      - name: Test CI suite manifest
        shell: pwsh
        run: node desktop/tests/test-suite-manifest.test.cjs

      - name: Test Analysis UI organization
        shell: pwsh
        run: node desktop/tests/analysis-ui-organization.test.cjs

      - name: Test Watch Run desktop monitoring
        shell: pwsh
        run: node desktop/tests/live-run.test.cjs

      - name: Test Review case identity binding
        shell: pwsh
        run: node desktop/tests/review-case-binding.test.cjs

      - name: Audit bilingual UI and overflow safeguards
        shell: pwsh
        run: node desktop/tests/bilingual-ui-audit.test.cjs

      - name: Test bilingual UI and overflow hardening
        shell: pwsh
        run: node desktop/tests/bilingual-ui.test.cjs

      - name: Publish portable Windows executable
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/publish | Out-Null
          dotnet restore desktop/src/FoamLensDesktop/FoamLensDesktop.csproj
          dotnet publish desktop/src/FoamLensDesktop/FoamLensDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/publish
          Copy-Item artifacts/publish/FoamLens.exe "artifacts/FoamLens-Portable-v$v.exe"

      - name: Smoke-test packaged FoamLens executable
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'artifacts/publish/FoamLens.exe').Path
          $log=Join-Path $env:LOCALAPPDATA 'FoamLens\Desktop\foamlens-desktop.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $env:FOAMLENS_SMOKE_SCREENSHOT=Join-Path (Resolve-Path 'artifacts').Path 'FoamLens-Portable-smoke.png'
          $env:FOAMLENS_SMOKE_LAUNCH_SCREENSHOT=Join-Path (Resolve-Path 'artifacts').Path 'FoamLens-Portable-launch.png'
          $env:FOAMLENS_BRAND_EVIDENCE_DIR=Join-Path (Resolve-Path 'artifacts').Path 'visual/portable'
          if ($env:HAS_QUICKCUP_FIXTURE -eq 'true') {
            $env:FOAMLENS_SMOKE_OPENFOAM_CASE=(Resolve-Path 'quickcup-runtime-fixture').Path
            $env:FOAMLENS_SMOKE_MIN_CASES='4'
            $env:FOAMLENS_SMOKE_INITIAL_CASE='SmokeCase_A'
            $env:FOAMLENS_SMOKE_SWITCH_CASE='B13_prghPressure_airGapOF14'
            $env:FOAMLENS_SMOKE_REGION='metal'
            $env:FOAMLENS_SMOKE_EXPECT_REGIONS='metal;mold'
            $env:FOAMLENS_SMOKE_FIELD='T'
            $env:FOAMLENS_SMOKE_TIME='9.8'
            $env:FOAMLENS_SMOKE_MIN_FIELD_SPAN='1'
          }
          $process=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(300000)) {
            try { $process.Kill($true) } catch {}
            throw 'FoamLens executable smoke test timed out after 300 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            $log=Join-Path $env:LOCALAPPDATA 'FoamLens\Desktop\foamlens-desktop.log'
            if (Test-Path $log) {
              Write-Host '---- FoamLens desktop log ----'
              Get-Content $log
              Write-Host '------------------------------'
            }
            throw "FoamLens executable smoke test failed with exit code $($process.ExitCode)."
          }
          if (Test-Path $log) {
            Copy-Item $log 'artifacts/FoamLens-Portable-smoke.log' -Force
            Write-Host '---- FoamLens portable smoke evidence ----'
            Get-Content $log | Select-String -Pattern '3D runtime UI smoke passed|video runtime smoke passed|real OpenFOAM packaged runtime smoke passed|synchronized View 2 legend/Probe smoke passed|Windows smoke test passed'
            Write-Host '------------------------------------------'
          } else {
            throw 'FoamLens portable smoke log was not created.'
          }
          Write-Host 'FoamLens executable started, loaded its embedded frontend, rendered the configured OpenFOAM runtime fixture, and exited successfully.'

      - name: Optional Authenticode signing for portable EXE
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $v='${{ steps.ver.outputs.version }}'
          [IO.File]::WriteAllBytes('artifacts/signing.pfx',[Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object {$_.FullName -match '\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /f artifacts/signing.pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/FoamLens-Portable-v$v.exe"
          Remove-Item artifacts/signing.pfx -Force

      - name: Create portable checksum
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $exe="artifacts/FoamLens-Portable-v$v.exe"
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FoamLens-Portable-v$v.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Build FoamLens installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $v='${{ steps.ver.outputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "/DPublishDir=$((Resolve-Path 'artifacts/publish').Path)" desktop/installer/FoamLens.iss
          Copy-Item "desktop/artifacts/FoamLens-Setup-v$v.exe" "artifacts/FoamLens-Setup-v$v.exe" -Force

      - name: Optional Authenticode signing for installer
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $v='${{ steps.ver.outputs.version }}'
          [IO.File]::WriteAllBytes('artifacts/signing.pfx',[Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object {$_.FullName -match '\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /f artifacts/signing.pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/FoamLens-Setup-v$v.exe"
          Remove-Item artifacts/signing.pfx -Force

      - name: Create installer checksum
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $exe="artifacts/FoamLens-Setup-v$v.exe"
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FoamLens-Setup-v$v.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Install and smoke-test FoamLens installer
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $installer=(Resolve-Path "artifacts/FoamLens-Setup-v$v.exe").Path
          $installDir=Join-Path (Resolve-Path 'artifacts').Path 'installed-smoke'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $installArgs=@(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            "/DIR=`"$installDir`""
          )
          $install=Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru
          if (-not $install.WaitForExit(60000)) {
            try { $install.Kill($true) } catch {}
            throw 'FoamLens installer smoke test timed out during silent installation.'
          }
          if ($install.ExitCode -ne 0) {
            throw "FoamLens installer failed with exit code $($install.ExitCode)."
          }

          $installedExe=Join-Path $installDir 'FoamLens.exe'
          if (-not (Test-Path $installedExe)) {
            throw "FoamLens.exe was not installed to $installDir."
          }

          $log=Join-Path $env:LOCALAPPDATA 'FoamLens\Desktop\foamlens-desktop.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $env:FOAMLENS_SMOKE_SCREENSHOT=Join-Path (Resolve-Path 'artifacts').Path 'FoamLens-Installed-smoke.png'
          $env:FOAMLENS_SMOKE_LAUNCH_SCREENSHOT=Join-Path (Resolve-Path 'artifacts').Path 'FoamLens-Installed-launch.png'
          $env:FOAMLENS_BRAND_EVIDENCE_DIR=Join-Path (Resolve-Path 'artifacts').Path 'visual/installed'
          if ($env:HAS_QUICKCUP_FIXTURE -eq 'true') {
            $env:FOAMLENS_SMOKE_OPENFOAM_CASE=(Resolve-Path 'quickcup-runtime-fixture').Path
            $env:FOAMLENS_SMOKE_MIN_CASES='4'
            $env:FOAMLENS_SMOKE_INITIAL_CASE='SmokeCase_A'
            $env:FOAMLENS_SMOKE_SWITCH_CASE='B13_prghPressure_airGapOF14'
            $env:FOAMLENS_SMOKE_REGION='metal'
            $env:FOAMLENS_SMOKE_EXPECT_REGIONS='metal;mold'
            $env:FOAMLENS_SMOKE_FIELD='T'
            $env:FOAMLENS_SMOKE_TIME='9.8'
            $env:FOAMLENS_SMOKE_MIN_FIELD_SPAN='1'
          }
          $app=Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(300000)) {
            try { $app.Kill($true) } catch {}
            throw 'Installed FoamLens smoke test timed out after 300 seconds.'
          }
          if ($app.ExitCode -ne 0) {
            if (Test-Path $log) {
              Write-Host '---- FoamLens desktop log ----'
              Get-Content $log
              Write-Host '------------------------------'
            }
            throw "Installed FoamLens smoke test failed with exit code $($app.ExitCode)."
          }
          if (Test-Path $log) {
            Copy-Item $log 'artifacts/FoamLens-Installed-smoke.log' -Force
            Write-Host '---- FoamLens installed smoke evidence ----'
            Get-Content $log | Select-String -Pattern '3D runtime UI smoke passed|video runtime smoke passed|real OpenFOAM packaged runtime smoke passed|synchronized View 2 legend/Probe smoke passed|Windows smoke test passed'
            Write-Host '-------------------------------------------'
          } else {
            throw 'FoamLens installed smoke log was not created.'
          }

          $uninstaller=Join-Path $installDir 'unins000.exe'
          if (Test-Path $uninstaller) {
            $uninstall=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
            if (-not $uninstall.WaitForExit(60000)) {
              try { $uninstall.Kill($true) } catch {}
              throw 'FoamLens uninstall cleanup timed out.'
            }
            if ($uninstall.ExitCode -ne 0) {
              throw "FoamLens uninstall cleanup failed with exit code $($uninstall.ExitCode)."
            }
          }
          Write-Host 'FoamLens installer installed successfully and the installed executable passed its startup smoke test.'

      - name: Validate real Home and About visual evidence at two viewport sizes
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          $v='${{ steps.ver.outputs.version }}'
          python tools/make_visual_evidence.py --evidence-dir artifacts/visual/installed --artifact "artifacts/FoamLens-Setup-v$v.exe" --source-sha $env:GITHUB_SHA --platform windows --output artifacts/visual/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not bind rendered Windows screenshots to installer SHA-256.' }
          python tools/visual_release_gate.py --manifest artifacts/visual/manifest.json --source-sha $env:GITHUB_SHA --platforms windows --surfaces home,about --capture-only
          if ($LASTEXITCODE -ne 0) { throw 'Rendered UI evidence failed: missing, blank, stale, or incorrect screenshots.' }

      - name: Sync canonical Windows ICO for future design builds
        if: ${{ startsWith(github.ref, 'refs/heads/design/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          icon='desktop/src/FoamLensDesktop/Assets/FoamLens.ico'
          python tools/generate_windows_icon.py --check
          if git diff --quiet -- "$icon"; then
            echo 'Arc-free canonical SVG and committed ICO match exactly; no extra build.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$icon"
          git commit -m 'build(branding): synchronize Windows ICO with canonical SVG'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'Regenerated ICO committed, revalidating new exact branch HEAD (Windows only).'
          gh workflow run build-foamlens-desktop.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload FoamLens Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FoamLens-Windows-v${{ steps.ver.outputs.version }}
          path: |
            artifacts/FoamLens-Portable-v${{ steps.ver.outputs.version }}.exe
            artifacts/FoamLens-Portable-v${{ steps.ver.outputs.version }}.exe.sha256
            artifacts/FoamLens-Setup-v${{ steps.ver.outputs.version }}.exe
            artifacts/FoamLens-Setup-v${{ steps.ver.outputs.version }}.exe.sha256
            artifacts/FoamLens-Portable-smoke.png
            artifacts/FoamLens-Portable-launch.png
            artifacts/FoamLens-Installed-launch.png
            artifacts/FoamLens-Installed-smoke.png
            artifacts/FoamLens-Portable-smoke.log
            artifacts/FoamLens-Installed-smoke.log
            artifacts/visual/
          if-no-files-found: error

      # Keep screenshots and smoke logs accessible when the executable fails.
      # A failed build should not erase the very evidence needed to fix it.
      - name: Preserve failed Windows UI validation evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: FoamLens-Windows-failed-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/visual/
            artifacts/*smoke.log
            artifacts/*smoke.png
            artifacts/*launch.png
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish after automated candidate validation
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FoamLens-Windows-v${{ needs.build.outputs.version }}
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify automated screenshot and exact-artifact integrity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow
          test -f artifacts/visual/manifest.json
          python tools/visual_release_gate.py --manifest artifacts/visual/manifest.json --source-sha "$GITHUB_SHA" --platforms windows --surfaces home,about --capture-only
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          doc=json.loads(Path('artifacts/visual/manifest.json').read_text())
          setup=next(Path('artifacts').glob('FoamLens-Setup-v*.exe'),None)
          if setup is None: raise SystemExit('No exact installer artifact found')
          digest=hashlib.sha256(setup.read_bytes()).hexdigest()
          if digest!=doc['artifact_sha256']['windows']: raise SystemExit('BLOCKED: validated screenshots belong to a different Setup digest')
          print('Release installer validated against screenshot manifest:',digest)
          PY
      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          python - "$v" <<'PY'
          import re,sys
          from pathlib import Path
          v=sys.argv[1]
          text=Path('CHANGELOG.md').read_text(encoding='utf-8')
          match=re.search(r'(?ms)^## Desktop v'+re.escape(v)+r'\b.*?(?=^## |\Z)',text)
          Path('artifacts/release-notes.md').write_text(match.group(0).strip() if match else f'FoamLens Windows release v{v}.',encoding='utf-8')
          PY
          assets=("artifacts/FoamLens-Portable-v$v.exe" "artifacts/FoamLens-Portable-v$v.exe.sha256" "artifacts/FoamLens-Setup-v$v.exe" "artifacts/FoamLens-Setup-v$v.exe.sha256")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "FoamLens $tag" --notes-file artifacts/release-notes.md
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "FoamLens $tag" --notes-file artifacts/release-notes.md
          fi
